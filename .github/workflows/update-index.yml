name: Update replication index

on:
  schedule:
    - cron: "42 6 3 * *" # monthly, off round numbers to avoid scheduler pile-up
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::purrr
            any::readr
            any::tibble
            any::stringr

      - name: Run data pipeline
        run: Rscript scripts/run_pipeline.R

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "Automated index refresh: $(date -u +%Y-%m-%d)"
          git push
